[package]
name = "ossia-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ossia-types = { path = "../ossia-types" }
ossia-score = { path = "../ossia-score" }
ossia-engine = { path = "../ossia-engine" }
ossia-library = { path = "../ossia-library" }
ossia-integrations = { path = "../ossia-integrations" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "process",
  "sync",
  "time",
  "signal",
] }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
tower-http = { version = "0.7", features = ["fs", "limit"] }
notify = "8"
interprocess = { version = "=2.4.8", features = ["tokio"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
clap = { version = "4", features = ["derive"] }
async-stream = "0.3"
dirs = "7"
fs2 = "0.4"
include_dir = "0.7"
if-addrs = "0.15"
percent-encoding = "2"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "multipart",
  "rustls",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream"] }
rmcp = { version = "3.10", features = ["client", "transport-child-process"] }
