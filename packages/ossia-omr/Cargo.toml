[package]
name = "ossia-omr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ossia-omr"
path = "src/main.rs"

[dependencies]
ossia-types = { path = "../ossia-types" }
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
quick-xml.workspace = true
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
tempfile = "3"

[lib]
path = "src/lib.rs"
