[package]
name = "ossia-desktop"
version.workspace = true
description = "Ossia — piano score editor with a local engraving engine"
edition = "2021"
rust-version.workspace = true

[lib]
name = "ossia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui"]
gui = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-autostart",
  "dep:sys-locale",
  "dep:tokio",
  "dep:reqwest",
  "dep:semver",
  "dep:sha2",
  "dep:uuid",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2.7.0", optional = true }
ossia-backend = { path = "../../../packages/ossia-backend" }
ossia-integrations = { path = "../../../packages/ossia-integrations" }
ossia-types = { path = "../../../packages/ossia-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
], optional = true }
semver = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
