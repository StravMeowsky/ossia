name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      tag:
        description: Release tag whose version should be injected before checks
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Check release dependency cache
        id: release-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true
      - name: Restore and save release dependency cache
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: pnpm/setup@v3.1.2
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - if: steps.release-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Warm release dependencies
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ossia/desktop exec tauri build --ci --no-bundle --target "${{ matrix.target }}"

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        if: inputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/version.mjs check "$RELEASE_TAG"
      - run: pnpm check
      - run: pnpm check:types
      - run: pnpm check:mcp
      - run: pnpm build:ui
      - run: pnpm test:scripts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins --tests -- --test-threads=1 --skip watcher_debounces_atomic_saves_and_recovers_deleted_file
      - name: Native watcher isolation
        run: cargo test -p ossia-backend --test watch watcher_debounces_atomic_saves_and_recovers_deleted_file -- --test-threads=1
      - name: Install browser test runtime
        run: pnpm --filter @ossia/ui exec playwright install chrome
      - name: Browser regression
        run: pnpm test:ui
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.os }}
          path: packages/ui/test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
